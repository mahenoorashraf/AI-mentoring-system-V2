<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | AI Mentoring System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="bi bi-gear-fill"></i>
            Settings
        </h2>

        <a href="/admin" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i>
            Back to Dashboard
        </a>
    </div>

    <!-- Account Settings -->
    <div class="card shadow mb-4">

        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">
                <i class="bi bi-person-circle"></i>
                Account Settings
            </h5>
        </div>

        <div class="card-body">

            <form action="/update_profile" method="POST">

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input
                        type="text"
                        class="form-control"
                        value="{{ current_user.username }}"
                        readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        name="email"
                        value="{{ admin.Email }}"
                        required>
                </div>

                <button class="btn btn-success">
                    <i class="bi bi-save"></i>
                    Save Profile
                </button>

            </form>

        </div>

    </div>

    <!-- Change Password -->
    <div class="card shadow mb-4">

        <div class="card-header bg-warning">
            <h5 class="mb-0">
                <i class="bi bi-key-fill"></i>
                Change Password
            </h5>
        </div>

        <div class="card-body">

            <form action="/change_password" method="POST">

                <div class="mb-3">
                    <label class="form-label">Current Password</label>
                    <input
                        type="password"
                        name="current_password"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input
                        type="password"
                        name="new_password"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control"
                        required>
                </div>

                <button class="btn btn-warning">
                    <i class="bi bi-key"></i>
                    Change Password
                </button>

            </form>

        </div>

    </div>

    <!-- Preferences -->
    <div class="card shadow">

        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">
                <i class="bi bi-sliders"></i>
                Preferences
            </h5>
        </div>

        <div class="card-body">

            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="darkMode">
                <label class="form-check-label" for="darkMode">
                    Dark Mode
                </label>
            </div>

            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" checked id="emailNotification">
                <label class="form-check-label" for="emailNotification">
                    Email Notifications
                </label>
            </div>

            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" checked id="mentorAlerts">
                <label class="form-check-label" for="mentorAlerts">
                    Mentor Booking Alerts
                </label>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
