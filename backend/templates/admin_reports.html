<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Reports | AI Mentoring System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background:#f4f7fb;
        }

        .sidebar{
            width:240px;
            min-height:100vh;
            background:#1f2937;
        }

        .sidebar h3{
            color:#fff;
        }

        .sidebar a{
            display:block;
            color:#d1d5db;
            text-decoration:none;
            padding:15px 20px;
        }

        .sidebar a:hover,
        .sidebar a.active{
            background:#2563eb;
            color:#fff;
        }

        .main{
            flex:1;
            padding:30px;
        }

        .report-card{
            border:none;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
            margin-bottom:30px;
        }

        .report-card img{
            width:100%;
            border-radius:10px;
        }

        .card-header{
            font-weight:bold;
        }

        .summary-card{
            border:none;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
        }
    </style>
</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->

    <div class="sidebar">

        <h3 class="text-center py-4">
            AI Mentor
        </h3>

        <a href="/admin">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </a>

        <a href="/students">
            <i class="bi bi-people-fill"></i>
            Students
        </a>

        <a href="/mentors">
            <i class="bi bi-person-workspace"></i>
            Mentors
        </a>

        <a href="/analytics">
            <i class="bi bi-bar-chart-fill"></i>
            Analytics
        </a>

        <a href="/admin_reports" class="active">
            <i class="bi bi-file-earmark-text"></i>
            Reports
        </a>

        <a href="/logout" class="text-danger">
            <i class="bi bi-box-arrow-right"></i>
            Logout
        </a>

    </div>

    <!-- Main -->

    <div class="main">

        <h2 class="mb-4">
            📊 AI Mentoring Reports
        </h2>

        <!-- Summary -->

        <div class="row mb-4">

            <div class="col-md-3">

                <div class="card summary-card">

                    <div class="card-body text-center">

                        <h6>Total Students</h6>

                        <h2>{{ students|length }}</h2>

                    </div>

                </div>

            </div>

        </div>

        <!-- Reports -->

        <div class="card report-card">

            <div class="card-header bg-primary text-white">
                Category Distribution
            </div>

            <div class="card-body">

                <img src="/outputs/category_pie.png">

            </div>

        </div>

        <div class="card report-card">

            <div class="card-header bg-success text-white">
                Feature Importance
            </div>

            <div class="card-body">

                <img src="/outputs/feature_importance.png">

            </div>

        </div>

        <div class="card report-card">

            <div class="card-header bg-warning">
                Confusion Matrix
            </div>

            <div class="card-body">

                <img src="/outputs/confusion_matrix.png">

            </div>

        </div>

        <div class="card report-card">

            <div class="card-header bg-info text-white">
                Correlation Heatmap
            </div>

            <div class="card-body">

                <img src="/outputs/heatmap.png">

            </div>

        </div>

        <div class="card report-card">

            <div class="card-header bg-danger text-white">
                Student Risk Index Distribution
            </div>

            <div class="card-body">

                <img src="/outputs/sri_distribution.png">

            </div>

        </div>

    </div>

</div>

</body>
</html>
